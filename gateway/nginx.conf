events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request timing and upstream response time
    log_format enterprise_combined '$remote_addr - $remote_user [$time_local] '
                                   '"$request" $status $body_bytes_sent '
                                   '"$http_referer" "$http_user_agent" '
                                   'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log enterprise_combined;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # High-performance Proxy Buffering
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;
    proxy_busy_buffers_size 64k;

    # Anti-Brute-Force Rate Limiting Zones (10MB memory zone ~ 160,000 unique IPs)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=60r/s;
    limit_req_status 429;

    upstream backend_server {
        server web:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        absolute_redirect off;

        server_tokens off;
        client_max_body_size 100M;

        # Enterprise OWASP Hardened Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Root redirect -> /operator/ (Primary Entry)
        location = / {
            return 302 /operator/;
        }

        # 2. Operator Panel (Django Web - Folder 1)
        location /operator/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # 3. Authentication & User Accounts (Django)
        location /accounts/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # 4. Django Admin (Unfold Dashboard at /djangoadmin/)
        location = /djangoadmin {
            return 301 /djangoadmin/;
        }

        location /djangoadmin/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # 5. React Admin Studio (Served at /admin/)
        location = /admin {
            return 301 /admin/;
        }

        location /admin/assets/ {
            alias /app/frontend_dist/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ^~ /admin/ {
            alias /app/frontend_dist/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 6. REST API with Dedicated Brute-Force Rate Limiting
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/ {
            limit_req zone=api_general_limit burst=50 nodelay;
            proxy_pass http://backend_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # 7. WebSockets (ASGI Live Channels & Notifications)
        location /ws/ {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 8. High-Performance Static & Media Delivery
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # NOTE: /media/ is intentionally NOT served publicly. Form attachments and
        # uploaded files are streamed by Django views with permission checks.
        # Only public branding assets (logos) are exposed:
        location /media/branding/ {
            alias /app/media/branding/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Deny direct access to any other media files (returns 403 instead of leaking uploads)
        location /media/ {
            deny all;
        }

        # Favicon shortcut
        location = /favicon.ico {
            alias /app/frontend_dist/favicon.svg;
            access_log off;
            log_not_found off;
        }

        # Fallback to backend for any other application routes
        location / {
            proxy_pass http://backend_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
